name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Context and application (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Check portable context and references
        run: python scripts/check_agent_setup.py
      - name: Check validator behavior
        run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Demonstrate compiled room transport
        run: node dist/scripts/room-demo.js

  container:
    name: Local Docker lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FRUIT_BOX_BIND: 127.0.0.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: node scripts/check_container.mjs
      - run: docker compose stop
      - name: Require stopped container
        run: test -z "$(docker compose ps --status running --quiet)"
      - run: docker compose up --detach --wait --wait-timeout 60
      - run: node scripts/check_container.mjs
      - name: Clean up local test containers
        if: ${{ always() }}
        run: docker compose down

  required:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check, container]
    if: ${{ always() }}
    steps:
      - name: Require every matrix job to succeed
        env:
          MATRIX_RESULT: ${{ needs.check.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$MATRIX_RESULT" = success
          test "$CONTAINER_RESULT" = success
