name: Agent context

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Agent setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Check portable context and references
        run: python scripts/check_agent_setup.py
      - name: Check validator behavior
        run: python -m unittest discover -s tests -p 'test_*.py'
