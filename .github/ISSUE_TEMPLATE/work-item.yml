name: Work item
description: A focused feature, bug, research task, or decision.
body:
  - type: textarea
    id: outcome
    attributes:
      label: Problem and desired outcome
      description: Explain the user-visible result or decision to reach.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Include relevant context and exclusions.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List checkable outcomes.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Describe how completion will be demonstrated.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking issues and relevant decisions.
  - type: dropdown
    id: handoff
    attributes:
      label: Handoff mode
      options:
        - Autonomous once prerequisites are settled
        - Human decision required before implementation
    validations:
      required: true
